services:
  - type: web
    name: phishguard
    runtime: python-3.11
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DATABASE_PATH
        value: database/phishguard.db
      - key: MODEL_PATH
        value: model/phishing_model.pkl
      - key: FEATURES_PATH
        value: model/feature_names.json
